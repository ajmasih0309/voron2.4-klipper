## Maker 3D Printing LLC. VoronKits.com Config 12/01/2022
## Voron 2.4R2 CW2 Stealthburner 350

# This file contains the configuration for the VoronKits.com Voron 2.4 R2 350X350X350
# We have added and Changed the following items:
## Added ABL Auto Bed Leveling
## Added Switchless Z Homing. Machine homes using the Omron Probe instead of a manual switch.
## Removed Manual Z Homing Switch
## Added Prime Line On Left Hand side of print surface
## Added Support For Stealthburner LED Lighting
## Configured Stealthburner Extruder Motors
## Configured Safe Z Homing For Probe
## PID Tuned Hotend & Bed Heater
## Added PWM To Bed Heater To Equalize Power To Prevent Flicker In Home Lighting 65HZ USA
## Added and adjusted fans for optimal cooling and quieter operation
## Added Klipper Screen for touchscreen interface and deactivated manual default screens
## Added Do Not Edit Beyond This Point Message above SAVE_CONFIG section.

## If you need help with your configuration file please reach out to your support team 
## at Voronkits.com or email info@voronkits.com please include your name and phone number
## along with your questions.

# This file also contains common pin mappings for the BigTreeTech Octopus V1. as of December 1, 2022.
# To use this config, the firmware should be compiled for the STM32F446 with a "32KiB bootloader"
# Enable "extra low-level configuration options" and select the "12MHz crystal" as clock reference

# after running "make", copy the generated "klipper/out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the OctoPus with that SD card.

# See docs/Config_Reference.md for a description of parameters.

## Voron Design VORON2 350mm BigTreeTech OctoPus V1 TMC2209 UART config


[include mainsail.cfg]
[exclude_object]
[include KAMP_Settings.cfg]
[include ./KLICKY/klicky-probe.cfg]
[include autoz.cfg]
[include ./macros/*.cfg]                  # contains all active macros (includes adxl for input shaping, just rename the file from txt to cfg)

#######
# Obsolete cfgs
#######
#[include adxl.cfg]    #Do Not Activate This Is For VoronKits.com Input Shaper Tuning Tool
#[include PIS.cfg]
#[include SHAKEnTUNE.cfg]
#[include DECONTAMINATOR.cfg]


[mcu]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_300026001550335331383520-if00
##--------------------------------------------------------------------

#####################################################################
#   Nozzle Wipe Variables
#####################################################################
[gcode_arcs]
resolution: 0.1

[firmware_retraction]
retract_length: 0.8
retract_speed: 45
unretract_extra_length: 0
unretract_speed: 45

[printer]
kinematics: corexy
max_velocity: 300  
max_accel: 4000             #Max 4000
max_z_velocity: 15          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0

#####################################################################
#   X/Y Stepper Settings
#####################################################################


[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: PG6
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 100   #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC4
interpolate: false
run_current: 0.8
sense_resistor: 0.110
#stealthchop_threshold: 0

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: PG9
position_min: 0
position_endstop:359.5
position_max: 359.5
homing_speed: 100  #Max 100
homing_retract_dist: 5
homing_positive_dir: true


[tmc2209 stepper_y]
uart_pin: PD11
interpolate: false
run_current: 0.8
sense_resistor: 0.110
#stealthchop_threshold: 0
 
#####################################################################
#   Z Stepper Settings
#####################################################################

[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
endstop_pin: PG10 #probe:z_virtual_endstop #PG10
#position_endstop: 1.354 1.581
position_max: 310
position_min: -5
homing_speed: 5
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: false
run_current: 0.8
sense_resistor: 0.110
#stealthchop_threshold: 0

[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: false
run_current: 0.8
sense_resistor: 0.110
#stealthchop_threshold: 0

[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: false
run_current: 0.8
sense_resistor: 0.110
#stealthchop_threshold: 0

[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: false
run_current: 0.8
sense_resistor: 0.110
#stealthchop_threshold: 0

#####################################################################
#   Extruder
#####################################################################


[extruder]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
rotation_distance: 21.7577633   #Adjusted For Accurate Extrusion Rate
gear_ratio: 50:10               #Stealthburner CW1 Gear Ratio
microsteps: 32                  
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree (Set For CW2)
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: PA2
sensor_type: ATC Semitec 104NT-4-R025H42G #ATC Semitec 104GT-2
sensor_pin: PF4
min_temp: 10
max_temp: 300
max_power: 1.0
min_extrude_temp: 170
#control = pid
#pid_kp = 26.213
#pid_ki = 1.304
#pid_kd = 131.721
pressure_advance: 0.05
pressure_advance_smooth_time: 0.040
max_extrude_cross_section: 5

[tmc2209 extruder]
uart_pin: PE1
interpolate: false
run_current: 0.5
sense_resistor: 0.110
#stealthchop_threshold: 0


#####################################################################
#   Bed Heater
#####################################################################

[heater_bed]
heater_pin: PA3
sensor_type: Generic 3950
sensor_pin: PF3
max_power: 0.6
min_temp: 0
max_temp: 120
pwm_cycle_time: 0.0166    #Added PWN For USA 65Hz
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

[temperature_sensor Extrusions]
sensor_type: Generic 3950
sensor_pin: PF5
min_temp: 0
max_temp: 125

[temperature_sensor chamber]
sensor_type: NTC 100K MGB18-104F39050L32 #Generic 3950
sensor_pin: PF6
min_temp: 0
max_temp: 125

[temperature_sensor MCU]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor Raspberry_Pi_4]
sensor_type: temperature_host
min_temp: 10
max_temp: 100 



#####################################################################
#   Probe
#####################################################################

[probe]

pin: PG15
x_offset: 0
y_offset: 20.6
#z_offset: 6.42
speed: 5
samples: 3
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.006
samples_tolerance_retries: 3

