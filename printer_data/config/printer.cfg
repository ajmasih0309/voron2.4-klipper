#####################################################################
#   Macros
# We have changed and added Macros for additional features and 
# To enhance performance of the machine
#####################################################################

[gcode_macro G32]
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    BED_MESH_CLEAR
    G90
    G28
    Status_homing
    QUAD_GANTRY_LEVEL
    Status_leveling
    #BED_MESH_CALIBRATE
    #Status_meshing
    G28
    Status_homing
    G0 X175 Y175 Z30 F3600
    RESTORE_GCODE_STATE NAME=STATE_G32

[gcode_macro CG28]
description: Homing only if necessary
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% else %}
        { action_respond_info("Printer already homed. Skipping G28.") }
    {% endif %}

[delayed_gcode FILTER_OFF]
gcode:
    SET_FAN_SPEED FAN=Nevermore SPEED=0

#####################################################################
#   print_start macro
#####################################################################

## *** THINGS TO UNCOMMENT: ***
## Bed mesh (2 lines at 2 locations)
## Z_TILT_ADJUST if your printer is a Trident
## Quad gantry level if your printer is a V2
## Nevermore - if you have one

[gcode_macro PRINT_START]
gcode:
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default("40")|int %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}
  {% set soften_temp = target_extruder - 40 %}

  # ---------- 1. Initialization ----------
  SET_DISPLAY_TEXT MSG="Initializing printer..."
  STATUS_HOMING         
  CG28                  
  G90                   
  BED_MESH_CLEAR       

  # ---------- 2. Bed Heating & Heatsoak ----------
  {% if target_bed > 90 %}
    SET_DISPLAY_TEXT MSG="Heating Bed: {target_bed}c"          
    STATUS_HEATING                                      
    M106 S255                                           
    SET_FAN_SPEED FAN=Nevermore SPEED=1.0              

    M190 S{target_bed}                                  
    SET_DISPLAY_TEXT MSG="Heatsoak Chamber: {target_chamber}c"  
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={target_chamber}  

  {% else %}
    SET_DISPLAY_TEXT MSG="Heating Bed: {target_bed}c"          
    STATUS_HEATING                                      
    SET_FAN_SPEED FAN=Nevermore SPEED=0.0               
    M190 S{target_bed}                                  
  {% endif %}

  # ---------- 3. Pre-Probe Cleaning Routine ----------
  SET_DISPLAY_TEXT MSG="Softening ooze: {soften_temp}c"
  M109 S{soften_temp}

  SET_DISPLAY_TEXT MSG="Initial wipe"
  M106 S255
  NOZZLE_CLEAN

  SET_DISPLAY_TEXT MSG="Cooling for probe (150c max)"
  M104 S150
  TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=172
  NOZZLE_CLEAN
  TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=152
  M107                                 ; Turn off parts fan

  # ---------- 4. Leveling & Mesh ----------
  SET_DISPLAY_TEXT MSG="Leveling Gantry (QGL)"      
  STATUS_LEVELING                 
  Attach_Probe_Lock
  quad_gantry_level               
  
  SET_DISPLAY_TEXT MSG="Re-homing Z"
  G28 Z                           

  SET_DISPLAY_TEXT MSG="Building Bed Mesh"    
  STATUS_MESHING                     
  BED_MESH_CALIBRATE                 
  
  SET_DISPLAY_TEXT MSG="Auto Z-Calibration"
  CALIBRATE_Z                                          
  Dock_Probe_Unlock

  # ---------- 5. Final Heat & Purge ----------
  SET_DISPLAY_TEXT MSG="Heating Hotend: {target_extruder}c"            
  STATUS_HEATING                                                
  NOZZLE_PARK_BUCKET                                            
  M109 S{target_extruder}                                       
  
  SET_DISPLAY_TEXT MSG="Final wipe & purge"
  NOZZLE_CLEAN                                                  
  STATUS_PRINTING                  
  G1 X{x_wait} Y{y_wait} Z15 F9000                 
  
  LINE_PURGE
  G90
  SET_DISPLAY_TEXT MSG="Printing!"
  
#####################################################################
#####################################################################
#####################################################################
[gcode_macro PRINT_END]
gcode:
    M400                           ; wait for buffer to clear
    SET_DISPLAY_TEXT MSG="Print Complete!"
    # STATUS_READY                 ; Uncomment if using Stealthburner LEDs
    
    G92 E0                         ; zero the extruder
    G1 E-3.0 F3600                 ; retract filament to relieve pressure
    
    # Calculate safe anti-stringing lift coordinates
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [[th.position.z + 2, 10.0]|max, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    
    G90                              ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  
    
    # 1. First wipe while fully hot to remove bulk plastic
    SET_DISPLAY_TEXT MSG="Hot wipe..."
    NOZZLE_CLEAN        
    
    # 2. Begin Cooldown
    SET_DISPLAY_TEXT MSG="Cooling nozzle to 170c"
    M140 S0                          ; turn off bed
    M104 S160                        ; set hotend to ooze-free temperature
    M107                             ; turn off part cooling fan
    
    # 3. Wait for hotend to cool
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=170
    
    # 4. Second wipe to snap off the hardened ooze
    SET_DISPLAY_TEXT MSG="Cold wipe to snap ooze"
    NOZZLE_CLEAN
    
    # 5. Final Shutdown & Park
    SET_DISPLAY_TEXT MSG="Shutting down heaters"
    M104 S0                          ; turn off hotend completely
    
    # Park toolhead at rear-center so it's out of the way for part removal
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 10} F3600
    
    # CLEAR_ACTIVE_SPOOL
    
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END
    
    ## THE 15-MINUTE TIMER (900 SECONDS)
    SET_DISPLAY_TEXT MSG="Filter runs for 15 mins"
    UPDATE_DELAYED_GCODE ID=FILTER_OFF DURATION=900 
    BED_MESH_CLEAR
    
    SET_DISPLAY_TEXT MSG="Done!"
#####################################################################
#####################################################################
#####################################################################
# Overide the existing PAUSE macro
[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
  ##### get user parameters or use default ##### 
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set idle_timeout = client.idle_timeout|default(0) %}
  {% set temp = printer[printer.toolhead.extruder].target if printer.toolhead.extruder != '' else 0 %}
  {% set restore = False if printer.toolhead.extruder == ''
              else True  if params.RESTORE|default(1)|int == 1 else False %}
  ##### end of definitions #####
  
  # Save the current temperature for the RESUME macro
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_extruder_temp VALUE="{{'restore': restore, 'temp': temp}}"
  
  # set a new idle_timeout value
  {% if idle_timeout > 0 %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=restore_idle_timeout VALUE={printer.configfile.settings.idle_timeout.timeout}
    SET_IDLE_TIMEOUT TIMEOUT={idle_timeout}
  {% endif %}
  
  PAUSE_BASE
  {client.user_pause_macro|default("")}
  
  # ----- CUSTOM PARK, WIPE, AND COOL LOGIC -----
  
  # 1. Calculate a safe 5mm Z-hop to clear the print
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - 5.0) %}
      {% set z_safe = 5.0 %}
  {% else %}
      {% set z_safe = max_z - act_z %}
  {% endif %}
  
  # 2. Retract to prevent stringing and lift Z
  G91
  G1 E-2.0 F3600
  G1 Z{z_safe} F900
  G90
  
  # 3. Park, wipe, and cool
  NOZZLE_PARK_BUCKET
  NOZZLE_CLEAN
  M104 S160
  
  SET_DISPLAY_TEXT MSG="Paused. Cooling to 160c."

#####################################################################
#####################################################################
#####################################################################
# Overide the existing RESUME macro
[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
variable_last_extruder_temp: {'restore': False, 'temp': 0}
variable_restore_idle_timeout: 0
variable_idle_state: False
gcode:
  ##### get user parameters or use default #####
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set velocity = printer.configfile.settings.pause_resume.recover_velocity %}
  {% set sp_move = client.speed_move|default(velocity) %}
  {% set runout_resume = True if client.runout_sensor|default("") == ""     # no runout
                     else True if not printer[client.runout_sensor].enabled  # sensor is disabled
                     else printer[client.runout_sensor].filament_detected %} # sensor status
  {% set can_extrude = True if printer.toolhead.extruder == ''           # no extruder defined in config
                   else printer[printer.toolhead.extruder].can_extrude %} # status of active extruder
  {% set do_resume = False %}
  {% set prompt_txt = [] %}
  ##### end of definitions #####
  
  #### 1. Reheat logic (Applies to both IDLE and regular PAUSE) ####
  {% if last_extruder_temp.restore %}
    RESPOND TYPE=echo MSG='{"Restoring \"%s\" temperature to %3.1f\u00B0C" % (printer.toolhead.extruder, last_extruder_temp.temp) }'
    M109 S{last_extruder_temp.temp}
    {% set do_resume = True %}
  {% elif can_extrude %}
    {% set do_resume = True %}
  {% else %} 
    RESPOND TYPE=error MSG='{"Resume aborted !!! \"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder}'
    {% set _d = prompt_txt.append("\"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder) %}
  {% endif %}

  #### 2. Reset IDLE state if needed ####
  {% if printer.idle_timeout.state|upper == "IDLE" or idle_state %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
  {% endif %}
  
  #### 3. Execute Resume ####
  {% if runout_resume %}
    {% if do_resume %}
      {% if restore_idle_timeout > 0 %} SET_IDLE_TIMEOUT TIMEOUT={restore_idle_timeout} {% endif %} # restore idle_timeout time
      {client.user_resume_macro|default("")}
      _CLIENT_EXTRUDE
      RESUME_BASE VELOCITY={params.VELOCITY|default(sp_move)}
    {% endif %}
  {% else %}
    RESPOND TYPE=error MSG='{"Resume aborted !!! \"%s\" detects no filament, please load filament and press RESUME" % (client.runout_sensor.split(" "))[1]}'
    {% set _d = prompt_txt.append("\"%s\" detects no filament, please load filament and press RESUME" % (client.runout_sensor.split(" "))[1]) %}
  {% endif %}
  
  ##### Generate User Information box in case of abort #####
  {% if not (runout_resume and do_resume) %} 
    RESPOND TYPE=command MSG="action:prompt_begin RESUME aborted !!!"
    {% for element in prompt_txt %}
      RESPOND TYPE=command MSG='{"action:prompt_text %s" % element}' 
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Ok|RESPOND TYPE=command MSG=action:prompt_end|info"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}
  
