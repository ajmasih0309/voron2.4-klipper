[include purge.cfg]
[include spoolman_tracking.cfg]

[gcode_macro LOAD_FILAMENT]
description: Loads filament, wipes, and initiates a non-blocking cooldown with a final wipe
gcode:
    {% set temp = params.TEMP|default(230)|float %}
    
    # 0. Cancel any pending background cooldown wipes if you re-run the macro early
    UPDATE_DELAYED_GCODE ID=_POST_LOAD_COOLDOWN_WIPE DURATION=0
    
    # ----- Blobifier Hardware Variables -----
    {% set servo_name = "blobifier" %}       
    {% set angle_extend = 0 %}               
    {% set angle_retract = 180 %}            
    
    # ----- Blob Shaping Variables -----
    {% set fast_load = 40.0 %}               
    {% set max_iteration_length = 40.0 %}    
    {% set iteration_z_raise = 2.0 %}        
    {% set iteration_z_change = 0.9 %}       
    {% set max_iterations = 2 %}             
    {% set pressure_release_time = 1000 %}   
    
    {% set blob_start_z = 2.5 %}             
    {% set z_speed = 1500 %}                 
    
    # 1. Park over the bucket safely
    NOZZLE_PARK_BUCKET POS=tray

    # 2. Deploy the Blobifier Tray
    SET_SERVO SERVO={servo_name} ANGLE={angle_extend}
    G4 P500                                  

    # 3. Drop Z to anchor the blob
    G90                                      
    G1 Z{blob_start_z} F{z_speed}

    # 4. Heat to target temperature
    {% if printer.extruder.temperature < temp %}
        M109 S{temp}
    {% endif %}

    # 5. Fast feed to the hotend
    M83                                      
    G1 E{fast_load} F300                     

    # 6. Form the Blob Iteratively
    M106 S255                                
    
    {% set ns = namespace(z_lift=iteration_z_raise) %}
    {% for i in range(max_iterations) %}
        G91                                            
        G1 E{max_iteration_length} Z{ns.z_lift} F150   
        G90                                            
        {% set ns.z_lift = ns.z_lift * iteration_z_change %} 
    {% endfor %}

    # 7. Pressure release and skin cooling
    G4 P{pressure_release_time}              
    G1 E-2 F300                              
    M106 S0                                  
    
    # 8. Drop the blob & shake to knock off stragglers
    SET_SERVO SERVO={servo_name} ANGLE={angle_retract}
    G4 P400                                  
    SET_SERVO SERVO={servo_name} ANGLE={angle_extend}
    G4 P400                                  
    SET_SERVO SERVO={servo_name} ANGLE={angle_retract}
    
    # 9. Initial Hot Wipe
    NOZZLE_CLEAN
    
    # 10. Start Cooldown and Trigger Background Tracker
    M104 S170                                ; Set heater to 170 without blocking console
    UPDATE_DELAYED_GCODE ID=_POST_LOAD_COOLDOWN_WIPE DURATION=5


[delayed_gcode _POST_LOAD_COOLDOWN_WIPE]
# This runs in the background and checks the temp every 5 seconds
gcode:
    {% set current_temp = printer.extruder.temperature %}
    {% set target_temp = 170.0 %}
    
    # If the temperature has dropped to 172 or lower, do the final wipe
    {% if current_temp <= (target_temp + 2.0) %}
        NOZZLE_CLEAN
        M104 S0                              ; Turn off the heater entirely after final wipe
    {% else %}
        # If it is still too hot, loop this check again in 5 seconds
        UPDATE_DELAYED_GCODE ID=_POST_LOAD_COOLDOWN_WIPE DURATION=5
    {% endif %}


[gcode_macro UNLOAD_FILAMENT]
description: Parks over bucket, shapes tip, unloads filament, and scrubs nozzle
gcode:
    {% set temp = params.TEMP|default(230)|float %}
    {% set retract_dist = 70.0 %}  # Distance to completely clear the extruder gears

    # 1. Park safely over the bucket
    NOZZLE_PARK_BUCKET

    # 2. Heat to target temperature
    {% if printer.extruder.temperature < temp %}
        M109 S{temp}
    {% endif %}

    # 3. Tip shaping (Crucial for preventing jams on the way up)
    M83                            ; Set extruder to relative positioning
    G1 E5 F300                     ; Extrude slightly to soften and bond the tip
    G1 E-15 F3000                  ; Fast jerk to snap the molten string
    
    # 4. Extract the filament
    G1 E-{retract_dist} F300       ; Steady pull to back it out of the toolhead

    CLEAR_ACTIVE_SPOOL
    
    # 5. Final scrub to remove any oozed wisps from the tip shaping
    NOZZLE_CLEAN