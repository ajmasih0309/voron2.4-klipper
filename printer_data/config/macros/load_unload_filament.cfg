[include purge.cfg]
[include spoolman_tracking.cfg]

[[gcode_macro LOAD_FILAMENT]
description: Loads filament, builds a cooling blob on the servo tray, and knocks it off
gcode:
    {% set temp = params.TEMP|default(230)|float %}
    
    # ----- Blobifier Hardware Variables -----
    {% set servo_name = "blobifier" %}       
    {% set angle_extend = 0 %}               # Corrected: Catch position
    {% set angle_retract = 180 %}            # Corrected: Drop position
    
    # ----- Blob Shaping Variables -----
    {% set fast_load = 40.0 %}               # Feed distance to heatbreak
    {% set max_iteration_length = 40.0 %}    # Extrusion amount per loop pass
    {% set iteration_z_raise = 6.0 %}        # Initial Z-lift per loop
    {% set iteration_z_change = 0.9 %}       # Reduces Z-lift speed as blob gets wider
    {% set max_iterations = 2 %}             # Number of loops
    {% set pressure_release_time = 1000 %}   # Dwell time in ms to solidify
    
    {% set blob_start_z = 2.5 %}             # Z-height to anchor the blob to the tray
    {% set z_speed = 1500 %}                 # Z-axis travel speed
    
    # 1. Park over the bucket safely (Stays at Z=15+)
    NOZZLE_PARK_BUCKET POS=tray

    # 2. Deploy the Blobifier Tray
    SET_SERVO SERVO={servo_name} ANGLE={angle_extend}
    G4 P500                                  ; Wait 500ms for tray to swing out

    # 3. Drop Z to anchor the blob to the metal strip
    G90                                      ; Absolute positioning
    G1 Z{blob_start_z} F{z_speed}

    # 4. Heat to target temperature
    {% if printer.extruder.temperature < temp %}
        M109 S{temp}
    {% endif %}

    # 5. Fast feed to the hotend
    M83                                      ; Set extruder to relative positioning
    G1 E{fast_load} F300                     ; Feed filament down into the heatbreak

    # 6. Form the Blob Iteratively
    M106 S255                                ; Blast the part cooling fan to 100%
    
    {% set ns = namespace(z_lift=iteration_z_raise) %}
    {% for i in range(max_iterations) %}
        G91                                            ; Relative positioning for Z
        G1 E{max_iteration_length} Z{ns.z_lift} F150   ; Extrude while lifting Z
        G90                                            ; Back to absolute positioning
        {% set ns.z_lift = ns.z_lift * iteration_z_change %} ; Decrease next Z lift
    {% endfor %}

    # 7. Pressure release and skin cooling
    G4 P{pressure_release_time}              ; Dwell to let the plastic skin over
    G1 E-2 F300                              ; Small retract to stop oozing
    M106 S0                                  ; Turn the cooling fan back off
    
    # 8. Drop the blob & shake to knock off stragglers
    SET_SERVO SERVO={servo_name} ANGLE={angle_retract}
    G4 P400                                  ; Wait for drop
    SET_SERVO SERVO={servo_name} ANGLE={angle_extend}
    G4 P400                                  ; Knock 1
    SET_SERVO SERVO={servo_name} ANGLE={angle_retract}
    G4 P400                                  ; Retract safely out of the way
    
    # 9. Final shear and brush scrub (Automatically lifts to safe Z)
    NOZZLE_CLEAN


[gcode_macro UNLOAD_FILAMENT]
description: Parks over bucket, shapes tip, unloads filament, and scrubs nozzle
gcode:
    {% set temp = params.TEMP|default(230)|float %}
    {% set retract_dist = 70.0 %}  # Distance to completely clear the extruder gears

    # 1. Park safely over the bucket
    NOZZLE_PARK_BUCKET

    # 2. Heat to target temperature
    {% if printer.extruder.temperature < temp %}
        M109 S{temp}
    {% endif %}

    # 3. Tip shaping (Crucial for preventing jams on the way up)
    M83                            ; Set extruder to relative positioning
    G1 E5 F300                     ; Extrude slightly to soften and bond the tip
    G1 E-15 F3000                  ; Fast jerk to snap the molten string
    
    # 4. Extract the filament
    G1 E-{retract_dist} F300       ; Steady pull to back it out of the toolhead

    CLEAR_ACTIVE_SPOOL
    
    # 5. Final scrub to remove any oozed wisps from the tip shaping
    NOZZLE_CLEAN