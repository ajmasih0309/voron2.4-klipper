[gcode_macro NOZZLE_PARK_BUCKET]
description: "Safely routes the nozzle to the tray or brush."
gcode:
    # Accept POS parameter (Defaults to "tray" for filament loading/purging)
    {% set pos = params.POS|default("tray")|string|lower %}
    
    # ---------- Coordinates ----------
    {% set safe_y = 330.0 %}            # Safe travel lane
    {% set park_y = 359.0 %}            # Back wall position
    {% set tray_x = 8.0 %}              # Position directly over the extended servo arm
    {% set brush_x = 87.0 %}            # Position 10mm left of the brush start (97)
    {% set safe_z_min = 15.0 %}         # Minimum safe Z clearance
    {% set travel_speed = 9000 %}
    {% set z_speed = 1500 %}
    
    # ---------- Dynamic Z & X Logic ----------
    # Compares current Z with safe_z_min and chooses the higher value
    {% set actual_safe_z = [printer.toolhead.position.z|float, safe_z_min]|max %}
    
    {% if pos == "tray" %}
        {% set target_x = tray_x %}
    {% else %}
        {% set target_x = brush_x %}
    {% endif %}

    # ---------- L-Shaped Safe Travel ----------
    G90                             ; Absolute positioning
    G1 Z{actual_safe_z} F{z_speed}  ; 1. Lift Z FIRST (never lowers if already high)
    G1 Y{safe_y} F{travel_speed}    ; 2. Move forward to safe travel lane
    G1 X{target_x} F{travel_speed}  ; 3. Cross the X-axis safely
    G1 Y{park_y} F{travel_speed}    ; 4. Move backward over the target


[gcode_macro NOZZLE_CLEAN]
description: "Linearly scrubs the nozzle clean."
gcode:
    # ---------- Define variables ----------
    {% set brush_ref_x = 97.0 %}        # Start of brush
    {% set usable_width = 31.0 %}       # 35mm brush minus 4mm buffer
    {% set cy = 359.0 %}                # Locked Y coordinate for linear scrub
    {% set clean_z = 2.75 %}            # Wipe height
    {% set safe_z_min = 15.0 %}         # Exit clearance height
    
    {% set scrub_passes = 5 %}          # Number of back-and-forth passes
    {% set scrub_speed = 3000 %}        # Speed for linear scrub
    {% set travel_speed = 9000 %}       
    {% set z_speed = 1500 %}            

    # 1. Use unified routing to arrive safely right next to the brush
    NOZZLE_PARK_BUCKET POS=brush

    # 2. Lower into the bristles
    G1 Z{clean_z} F{z_speed}

    # 3. Linear Scrub (Y-Axis Locked)
    {% for i in range(scrub_passes) %}
        G1 X{brush_ref_x} F{scrub_speed}                 ; Wipe left
        G1 X{brush_ref_x + usable_width} F{scrub_speed}  ; Wipe right
    {% endfor %}

    # 4. Safe Exit
    {% set actual_safe_z = [printer.toolhead.position.z|float, safe_z_min]|max %}
    G1 Z{actual_safe_z} F{z_speed}      ; Lift out of brush
    G1 Y330 F{travel_speed}             ; Step forward into safe lane